# The one list of what a WHIP install is: every resource, at the tag it installs, and where it goes.
#
# tools/recipes.py makes every recipe from this file and the two server.*.cfg next to it:
#   whip-legacy.yaml, whip-enhanced.yaml            the full install, from GitHub
#   whip-legacy-lite.yaml, whip-enhanced-lite.yaml  everything but the heavy packs, from GitHub
# and, when CI publishes a release to the CDN, the same four with every download from the CDN.
# When a WHIPFX resource publishes a release, the Recipe update (tools/recipe_update.py) moves its tag (and parts) here,
# runs tools/recipes.py and pushes both to main. bob74_ipl and oxmysql are by hand: change a tag here, run
# `python tools/recipes.py`, and commit both. CI fails if they disagree.
#
# Each resource has:
#   name     its folder name
#   repo     owner/name on GitHub
#   tag      the release it installs
#   dest     its folder in the server
#   github   how the GitHub recipes get it:
#              "source"         download_github of the tag (GitHub zips it on request)
#              "release-zips"   the zips tools/release_zips.py attached to the release; parts = how many
#              "release-asset"  one file attached to the release (asset = its name), unzipped into dest
#   heavy    true for the packs the lite recipes leave out (the media packs and the Mirror Park homes)
#   note     an optional comment line above its tasks; {tag} is replaced with its tag
#
# The CDN recipes ignore github/parts/asset: CI zips every resource at its tag itself (tools/cdn.py).

[recipe]
version = "1.0.0"
author = "WHIPFX"
# The largest zip CI makes for the CDN, and the slowest connection a part must still finish on within txAdmin's
# 150 seconds per download. 40 MiB at 3 Mbit/s takes 112 s. Raising one means checking the other: the verify step
# fails a release whose parts would not finish in 90% of 150 s at min_mbit.
max_part_mib = 40
min_mbit = 3

[platform.legacy]
title = "Legacy (FXServer)"
name = "WHIP"
lite_name = "WHIP Lite"
min_fx_version = 38435
min_fx_note = "FXServer artifact 38435 or newer (sv_enforceSteamAuth alone needs 38004)"
server_cfg = "server.legacy.cfg"

[platform.enhanced]
title = "GTA V Enhanced (cfx-server)"
name = "WHIP (Enhanced)"
lite_name = "WHIP Lite (Enhanced)"
server_cfg = "server.enhanced.cfg"

