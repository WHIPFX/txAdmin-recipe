# WHIP for a Legacy (FXServer) server: a txAdmin recipe (https://github.com/citizenfx/txAdmin/blob/master/docs/recipe.md).
# On txAdmin's setup page choose "Remote URL Template" and paste this file's raw URL. It makes a whole new server.
#
# A WHIP release is the list of tags below: each resource is downloaded as it is at its release (a tag on its own
# repository). whip-enhanced.yaml has the same list: change both together.
#
# txAdmin gives each download 150 seconds, and a recipe can't change that. download_github gets a zip that GitHub builds
# on request, often too slowly for the big resources. So whip_gunny, whip_homes_mirrorpark and the media packs come as
# zips attached to their releases, from GitHub's CDN, each 40 MiB or less (about 2.3 Mbit/s in 150 seconds). GitHub
# makes them when one of those repos publishes a release (tools/release_zips.py), and the run's summary has their
# tasks for here.
# Each download_github is one call to GitHub's API (60 an hour without a token): 13 here.

$engine: 3
$onesync: on
$minFxVersion: 38435   # FXServer artifact 38435 or newer (sv_enforceSteamAuth alone needs 38004)
name: WHIP
version: 1.0.0
author: WHIPFX
description: >-
  WHIP, a complete server base: characters, inventory, money and banks, jobs, cars, homes, and an admin panel in game
  (/whip). For a Legacy (FXServer) server. Downloads about 830 MB from GitHub.

tasks:
  # ---- WHIP ----------------------------------------------------------------------------------------------------------
  - action: download_github
    src: WHIPFX/whip_core
    ref: v1.0.1
    dest: ./resources/whip_core

  - action: download_github
    src: WHIPFX/whip_autos
    ref: v1.0.0
    dest: ./resources/whip_autos

  - action: download_github
    src: WHIPFX/whip_autos_shop
    ref: v1.0.0
    dest: ./resources/whip_autos_shop

  - action: download_github
    src: WHIPFX/whip_chat
    ref: v1.1.0
    dest: ./resources/whip_chat

  - action: download_github
    src: WHIPFX/whip_dealership
    ref: v1.0.0
    dest: ./resources/whip_dealership

  - action: download_github
    src: WHIPFX/whip_fuel
    ref: v1.0.0
    dest: ./resources/whip_fuel

  # whip_gunny v2.0.0, as its release's zips (made by tools/release_zips.py)
  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.0/whip_gunny-1.zip
    path: ./tmp/whip_gunny-1.zip

  - action: unzip
    src: ./tmp/whip_gunny-1.zip
    dest: ./resources/whip_gunny

  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.0/whip_gunny-2.zip
    path: ./tmp/whip_gunny-2.zip

  - action: unzip
    src: ./tmp/whip_gunny-2.zip
    dest: ./resources/whip_gunny

  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.0/whip_gunny-3.zip
    path: ./tmp/whip_gunny-3.zip

  - action: unzip
    src: ./tmp/whip_gunny-3.zip
    dest: ./resources/whip_gunny

  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.0/whip_gunny-4.zip
    path: ./tmp/whip_gunny-4.zip

  - action: unzip
    src: ./tmp/whip_gunny-4.zip
    dest: ./resources/whip_gunny

  - action: download_github
    src: WHIPFX/whip_loadingscreen
    ref: v1.6.2
    dest: ./resources/whip_loadingscreen

  - action: download_github
    src: WHIPFX/whip_phone
    ref: v1.1.0
    dest: ./resources/whip_phone

  - action: download_github
    src: WHIPFX/whip_rope
    ref: v1.0.0
    dest: ./resources/whip_rope

  - action: download_github
    src: WHIPFX/whip_voice
    ref: v1.0.0
    dest: ./resources/whip_voice

  # ---- WHIP's media packs, in [assets]/[media] -----------------------------------------------------------------------
  # Each as its release's zips (v1.0.0), made by tools/release_zips.py
  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-1.zip
    path: ./tmp/whip_media_clothing_male-1.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_male-1.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_male

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-2.zip
    path: ./tmp/whip_media_clothing_male-2.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_male-2.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_male

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-3.zip
    path: ./tmp/whip_media_clothing_male-3.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_male-3.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_male

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-4.zip
    path: ./tmp/whip_media_clothing_male-4.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_male-4.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_male

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-1.zip
    path: ./tmp/whip_media_clothing_female-1.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_female-1.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_female

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-2.zip
    path: ./tmp/whip_media_clothing_female-2.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_female-2.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_female

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-3.zip
    path: ./tmp/whip_media_clothing_female-3.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_female-3.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_female

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-4.zip
    path: ./tmp/whip_media_clothing_female-4.zip

  - action: unzip
    src: ./tmp/whip_media_clothing_female-4.zip
    dest: ./resources/[assets]/[media]/whip_media_clothing_female

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-1.zip
    path: ./tmp/whip_media_props-1.zip

  - action: unzip
    src: ./tmp/whip_media_props-1.zip
    dest: ./resources/[assets]/[media]/whip_media_props

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-2.zip
    path: ./tmp/whip_media_props-2.zip

  - action: unzip
    src: ./tmp/whip_media_props-2.zip
    dest: ./resources/[assets]/[media]/whip_media_props

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-3.zip
    path: ./tmp/whip_media_props-3.zip

  - action: unzip
    src: ./tmp/whip_media_props-3.zip
    dest: ./resources/[assets]/[media]/whip_media_props

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-1.zip
    path: ./tmp/whip_media_previews-1.zip

  - action: unzip
    src: ./tmp/whip_media_previews-1.zip
    dest: ./resources/[assets]/[media]/whip_media_previews

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-2.zip
    path: ./tmp/whip_media_previews-2.zip

  - action: unzip
    src: ./tmp/whip_media_previews-2.zip
    dest: ./resources/[assets]/[media]/whip_media_previews

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-3.zip
    path: ./tmp/whip_media_previews-3.zip

  - action: unzip
    src: ./tmp/whip_media_previews-3.zip
    dest: ./resources/[assets]/[media]/whip_media_previews

  - action: download_file
    url: https://github.com/WHIPFX/whip_media_map/releases/download/v1.0.0/whip_media_map-1.zip
    path: ./tmp/whip_media_map-1.zip

  - action: unzip
    src: ./tmp/whip_media_map-1.zip
    dest: ./resources/[assets]/[media]/whip_media_map

  # ---- WHIP's map packs, in [assets] ---------------------------------------------------------------------------------
  # whip_homes_mirrorpark v1.0.0, as its release's zips (made by tools/release_zips.py)
  - action: download_file
    url: https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.0/whip_homes_mirrorpark-1.zip
    path: ./tmp/whip_homes_mirrorpark-1.zip

  - action: unzip
    src: ./tmp/whip_homes_mirrorpark-1.zip
    dest: ./resources/[assets]/whip_homes_mirrorpark

  - action: download_file
    url: https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.0/whip_homes_mirrorpark-2.zip
    path: ./tmp/whip_homes_mirrorpark-2.zip

  - action: unzip
    src: ./tmp/whip_homes_mirrorpark-2.zip
    dest: ./resources/[assets]/whip_homes_mirrorpark

  - action: download_file
    url: https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.0/whip_homes_mirrorpark-3.zip
    path: ./tmp/whip_homes_mirrorpark-3.zip

  - action: unzip
    src: ./tmp/whip_homes_mirrorpark-3.zip
    dest: ./resources/[assets]/whip_homes_mirrorpark

  - action: download_github
    src: WHIPFX/whip_graphics
    ref: v2.1.0
    dest: ./resources/[assets]/whip_graphics

  # ---- Chameleon Paint, in [assets]: WildBrick142's ramps for whip_autos' Chameleon paints (theirs, not WHIP's) --------
  - action: download_github
    src: WHIPFX/chameleon_paint
    ref: v2.0.0
    dest: ./resources/[assets]/chameleon_paint

  # ---- bob74_ipl, in [assets]: Bob74's IPL loader, which fills the map's holes and opens GTA Online's interiors ------
  - action: download_github
    src: Bob74/bob74_ipl
    ref: 2.7.1
    dest: ./resources/[assets]/bob74_ipl

  # ---- oxmysql: WHIPFX's fork (2.14.3 with the P-001 fix), its release build, into [ox] ------------------------------
  - action: download_file
    url: https://github.com/WHIPFX/oxmysql/releases/download/v2.14.3-whip.1/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  - action: remove_path
    path: ./tmp

  # ---- The database: empty. WHIP makes every table itself on its first start; there is no SQL file. -------------------
  - action: connect_database

  # ---- server.cfg: txAdmin fills in the {{...}} values when the deploy finishes ----------------------------------------
  - action: write_file
    file: ./server.cfg
    data: |
      # Your WHIP server. Its name, description and tags are set on https://portal.cfx.re/servers
      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      {{serverEndpoints}}

      set mysql_connection_string "{{dbConnectionString}}"

      # The game build WHIP is made for (or newer)
      sv_enforceGameBuild 3889
      sv_scriptHookAllowed 0
      # Players need a Steam account linked to their Cfx.re account
      set sv_enforceSteamAuth true
      # Disable the Mumble voice server in favor of whip_voice
      set mumble_disableServer true

      ensure oxmysql
      ensure whip_core
      ensure whip_autos
      ensure whip_autos_shop
      ensure whip_chat
      ensure whip_dealership
      ensure whip_fuel
      ensure whip_gunny
      ensure whip_loadingscreen
      ensure whip_phone
      ensure whip_rope
      # whip_voice runs its own voice server on this machine, and FXServer lets a resource start a program only
      # with this line. Players send their voices to UDP 7882-7893 and TCP 7881: open those inbound, as 30120.
      add_unsafe_child_process_permission whip_voice
      ensure whip_voice
      ensure [assets]    # the media packs, the map packs and bob74_ipl

      # Your own resources go below, each after WHIP: ensure mycafe

      ## Admins: you (txAdmin's master account) are in group.admin, which gets WHIP's tools (/w and /whip)
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      add_ace group.admin whip.devtools allow
      {{addPrincipalsMaster}}
