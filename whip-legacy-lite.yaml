# WHIP for a Legacy (FXServer) server: a txAdmin recipe (https://github.com/citizenfx/txAdmin/blob/master/docs/recipe.md).
# On txAdmin's setup page choose "Remote URL Template" and paste this file's URL. It makes a whole new server.
#
# Made by tools/recipes.py from recipe/manifest.toml, which lists every resource at the tag it installs (a release on
# its own repository): change the manifest, not this file. whip-enhanced.yaml has the same list. GitHub moves the
# manifest to a WHIPFX resource's latest release when it publishes one (.github/workflows/recipe-update.yml); bob74_ipl
# and oxmysql are by hand.
#
# txAdmin gives each download 150 seconds, and a recipe can't change that. download_github gets a zip that GitHub builds
# on request, often too slowly for the big resources. So those come as zips attached to their releases, from GitHub's
# CDN, each 40 MiB or less (about 2.3 Mbit/s in 150 seconds). GitHub makes them when one of those repos publishes a
# release (tools/release_zips.py), then puts their tasks here. Their unzips get 1800 seconds: some servers (a slow disk,
# or antivirus checking each new file) take more than the 180 txAdmin allows by default to write a few thousand small
# files.
# Each download_github is one call to GitHub's API (60 an hour without a token): 13 here.
#
# The lite recipe: everything except the heavy packs (whip_media_clothing_male, whip_media_clothing_female,
# whip_media_props, whip_media_previews, whip_media_map and whip_homes_mirrorpark), so it downloads and unzips far less.
# It writes get-whip-media.ps1 and get-whip-media.sh into the server folder: run one once the install is done to add the
# heavy packs, outside txAdmin's time limits. Until then the server has none of them.

$engine: 3
$onesync: on
$minFxVersion: 38435   # FXServer artifact 38435 or newer (sv_enforceSteamAuth alone needs 38004)
name: WHIP Lite
version: 1.0.0
author: WHIPFX
description: >-
  WHIP, a complete server base: characters, inventory, money and banks, jobs, cars, homes, and an admin panel in game
  (/whip). For a Legacy (FXServer) server. Lite: no media packs or Mirror Park homes.

tasks:
  # ---- WHIP ----------------------------------------------------------------------------------------------------------
  - action: download_github
    src: WHIPFX/whip_core
    ref: v1.3.0
    dest: ./resources/whip_core

  - action: download_github
    src: WHIPFX/whip_autos
    ref: v1.0.0
    dest: ./resources/whip_autos

  - action: download_github
    src: WHIPFX/whip_autos_shop
    ref: v1.0.1
    dest: ./resources/whip_autos_shop

  - action: download_github
    src: WHIPFX/whip_chat
    ref: v1.2.0
    dest: ./resources/whip_chat

  - action: download_github
    src: WHIPFX/whip_dealership
    ref: v1.0.0
    dest: ./resources/whip_dealership

  - action: download_github
    src: WHIPFX/whip_fuel
    ref: v1.0.0
    dest: ./resources/whip_fuel

  # whip_gunny v2.0.1, as its release's zips (made by tools/release_zips.py)
  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.1/whip_gunny-1.zip
    path: ./tmp/whip_gunny-1.zip

  - action: unzip
    src: ./tmp/whip_gunny-1.zip
    dest: ./resources/whip_gunny
    timeoutSeconds: 1800

  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.1/whip_gunny-2.zip
    path: ./tmp/whip_gunny-2.zip

  - action: unzip
    src: ./tmp/whip_gunny-2.zip
    dest: ./resources/whip_gunny
    timeoutSeconds: 1800

  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.1/whip_gunny-3.zip
    path: ./tmp/whip_gunny-3.zip

  - action: unzip
    src: ./tmp/whip_gunny-3.zip
    dest: ./resources/whip_gunny
    timeoutSeconds: 1800

  - action: download_file
    url: https://github.com/WHIPFX/whip_gunny/releases/download/v2.0.1/whip_gunny-4.zip
    path: ./tmp/whip_gunny-4.zip

  - action: unzip
    src: ./tmp/whip_gunny-4.zip
    dest: ./resources/whip_gunny
    timeoutSeconds: 1800

  - action: download_github
    src: WHIPFX/whip_loadingscreen
    ref: v1.6.2
    dest: ./resources/whip_loadingscreen

  - action: download_github
    src: WHIPFX/whip_phone
    ref: v1.1.0
    dest: ./resources/whip_phone

  - action: download_github
    src: WHIPFX/whip_rope
    ref: v1.0.0
    dest: ./resources/whip_rope

  - action: download_github
    src: WHIPFX/whip_voice
    ref: v1.0.0
    dest: ./resources/whip_voice

  # ---- WHIP's map packs, in [assets] ---------------------------------------------------------------------------------
  - action: download_github
    src: WHIPFX/whip_graphics
    ref: v2.1.0
    dest: ./resources/[assets]/whip_graphics

  # ---- Chameleon Paint, in [assets]: WildBrick142's ramps for whip_autos' Chameleon paints (theirs, not WHIP's) ------
  - action: download_github
    src: WHIPFX/chameleon_paint
    ref: v2.0.0
    dest: ./resources/[assets]/chameleon_paint

  # ---- bob74_ipl, in [assets]: Bob74's IPL loader, which fills the map's holes and opens GTA Online's interiors ------
  - action: download_github
    src: Bob74/bob74_ipl
    ref: 2.7.1
    dest: ./resources/[assets]/bob74_ipl

  # ---- oxmysql: WHIPFX's fork (2.14.3 with the P-001 fix), its release build, into [ox] ------------------------------
  - action: download_file
    url: https://github.com/WHIPFX/oxmysql/releases/download/v2.14.3-whip.1/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  - action: remove_path
    path: ./tmp

  # ---- The heavy packs: a separate download, once the install is done ------------------------------------------------
  # Run get-whip-media.ps1 (Windows) or get-whip-media.sh (Linux) in the server folder to add whip_media_clothing_male,
  # whip_media_clothing_female, whip_media_props, whip_media_previews, whip_media_map and whip_homes_mirrorpark.
  - action: write_file
    file: ./get-whip-media.ps1
    data: |
      # Adds WHIP's heavy packs (whip_media_clothing_male, whip_media_clothing_female, whip_media_props, whip_media_previews,
      # whip_media_map and whip_homes_mirrorpark) to a server installed with a WHIP lite recipe. It downloads 18 zips from
      # GitHub, checks each one, and unzips it into its resource's folder. If it stops, run it again: it keeps the zips it
      # already has.
      # Run it in this folder (the one with server.cfg), with the server stopped:
      #   powershell -ExecutionPolicy Bypass -File get-whip-media.ps1
      $ErrorActionPreference = 'Stop'
      [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
      Add-Type -AssemblyName System.IO.Compression.FileSystem
      $root = $PSScriptRoot
      $tmp = [IO.Path]::Combine($root, 'tmp-whip-media')
      [IO.Directory]::CreateDirectory($tmp) | Out-Null
      # url, folder, size and sha256 (0 and '' when not known)
      $parts = @(
          ,@('https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-1.zip', 'resources/[assets]/[media]/whip_media_clothing_male', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-2.zip', 'resources/[assets]/[media]/whip_media_clothing_male', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-3.zip', 'resources/[assets]/[media]/whip_media_clothing_male', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-4.zip', 'resources/[assets]/[media]/whip_media_clothing_male', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-1.zip', 'resources/[assets]/[media]/whip_media_clothing_female', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-2.zip', 'resources/[assets]/[media]/whip_media_clothing_female', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-3.zip', 'resources/[assets]/[media]/whip_media_clothing_female', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-4.zip', 'resources/[assets]/[media]/whip_media_clothing_female', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-1.zip', 'resources/[assets]/[media]/whip_media_props', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-2.zip', 'resources/[assets]/[media]/whip_media_props', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-3.zip', 'resources/[assets]/[media]/whip_media_props', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-1.zip', 'resources/[assets]/[media]/whip_media_previews', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-2.zip', 'resources/[assets]/[media]/whip_media_previews', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-3.zip', 'resources/[assets]/[media]/whip_media_previews', 0, '')
          ,@('https://github.com/WHIPFX/whip_media_map/releases/download/v1.0.0/whip_media_map-1.zip', 'resources/[assets]/[media]/whip_media_map', 0, '')
          ,@('https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.1/whip_homes_mirrorpark-1.zip', 'resources/[assets]/whip_homes_mirrorpark', 0, '')
          ,@('https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.1/whip_homes_mirrorpark-2.zip', 'resources/[assets]/whip_homes_mirrorpark', 0, '')
          ,@('https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.1/whip_homes_mirrorpark-3.zip', 'resources/[assets]/whip_homes_mirrorpark', 0, '')
      )

      function Test-Part($file, $size, $sha) {
          if (-not [IO.File]::Exists($file)) { return $false }
          if ($size -gt 0 -and (New-Object IO.FileInfo $file).Length -ne $size) { return $false }
          if ($sha -and (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $sha) { return $false }
          return $true
      }

      $web = New-Object Net.WebClient
      foreach ($p in $parts) {
          $url, $dest, $size, $sha = $p
          $file = [IO.Path]::Combine($tmp, $url.Split('/')[-1])
          for ($try = 1; -not (Test-Part $file $size $sha); $try++) {
              if ($try -gt 3) { throw "Could not download $url" }
              if ($try -gt 1) { Write-Host '  It failed: trying again'; Start-Sleep -Seconds 5 }
              Write-Host "Downloading $url"
              try {
                  $web.DownloadFile($url, "$file.part")
                  [IO.File]::Delete($file)
                  [IO.File]::Move("$file.part", $file)
              } catch { Write-Host "  $($_.Exception.Message)" }
          }
          $target = [IO.Path]::GetFullPath([IO.Path]::Combine($root, $dest))
          Write-Host "Unzipping into $dest"
          $zip = [IO.Compression.ZipFile]::OpenRead($file)
          try {
              foreach ($entry in $zip.Entries) {
                  $out = [IO.Path]::GetFullPath([IO.Path]::Combine($target, $entry.FullName))
                  if (-not $out.StartsWith($target + [IO.Path]::DirectorySeparatorChar)) { throw "Unsafe path in the zip: $($entry.FullName)" }
                  if ($entry.FullName.EndsWith('/')) { continue }
                  [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($out)) | Out-Null
                  [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $out, $true)
              }
          } finally { $zip.Dispose() }
      }
      [IO.Directory]::Delete($tmp, $true)
      Write-Host 'Done. Start the server: the ensure [assets] line in server.cfg starts the new packs.'

  - action: write_file
    file: ./get-whip-media.sh
    data: |
      #!/bin/sh
      # Adds WHIP's heavy packs (whip_media_clothing_male, whip_media_clothing_female, whip_media_props, whip_media_previews,
      # whip_media_map and whip_homes_mirrorpark) to a server installed with a WHIP lite recipe. It downloads 18 zips from
      # GitHub, checks each one, and unzips it into its resource's folder. If it stops, run it again: it keeps the zips it
      # already has. It needs curl and unzip.
      # Run it in this folder (the one with server.cfg), with the server stopped:  sh get-whip-media.sh
      set -eu
      cd "$(dirname "$0")"
      for tool in curl unzip; do
        command -v "$tool" >/dev/null 2>&1 || { echo "get-whip-media.sh needs $tool" >&2; exit 1; }
      done
      tmp='tmp-whip-media'
      mkdir -p "$tmp"

      sha256() {
        if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi
      }
      # file size sha256: is the file there and whole? (size 0 and an empty sha256 when not known)
      ok() {
        [ -f "$1" ] || return 1
        if [ "$2" -gt 0 ] && [ "$(wc -c < "$1" | tr -d ' ')" -ne "$2" ]; then return 1; fi
        if [ -n "$3" ] && [ "$(sha256 "$1")" != "$3" ]; then return 1; fi
        return 0
      }
      # url folder size sha256
      get() {
        file="$tmp/${1##*/}"
        try=1
        until ok "$file" "$3" "$4"; do
          if [ "$try" -gt 3 ]; then echo "Could not download $1" >&2; exit 1; fi
          if [ "$try" -gt 1 ]; then echo "  It failed: trying again"; sleep 5; fi
          echo "Downloading $1"
          curl -fsSL --retry 3 -o "$file.part" "$1" && mv -f "$file.part" "$file" || true
          try=$((try + 1))
        done
        echo "Unzipping into $2"
        mkdir -p "$2"
        unzip -o -q "$file" -d "$2"
      }

      get 'https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-1.zip' 'resources/[assets]/[media]/whip_media_clothing_male' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-2.zip' 'resources/[assets]/[media]/whip_media_clothing_male' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-3.zip' 'resources/[assets]/[media]/whip_media_clothing_male' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_male/releases/download/v1.0.0/whip_media_clothing_male-4.zip' 'resources/[assets]/[media]/whip_media_clothing_male' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-1.zip' 'resources/[assets]/[media]/whip_media_clothing_female' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-2.zip' 'resources/[assets]/[media]/whip_media_clothing_female' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-3.zip' 'resources/[assets]/[media]/whip_media_clothing_female' 0 ''
      get 'https://github.com/WHIPFX/whip_media_clothing_female/releases/download/v1.0.0/whip_media_clothing_female-4.zip' 'resources/[assets]/[media]/whip_media_clothing_female' 0 ''
      get 'https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-1.zip' 'resources/[assets]/[media]/whip_media_props' 0 ''
      get 'https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-2.zip' 'resources/[assets]/[media]/whip_media_props' 0 ''
      get 'https://github.com/WHIPFX/whip_media_props/releases/download/v1.0.0/whip_media_props-3.zip' 'resources/[assets]/[media]/whip_media_props' 0 ''
      get 'https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-1.zip' 'resources/[assets]/[media]/whip_media_previews' 0 ''
      get 'https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-2.zip' 'resources/[assets]/[media]/whip_media_previews' 0 ''
      get 'https://github.com/WHIPFX/whip_media_previews/releases/download/v1.0.0/whip_media_previews-3.zip' 'resources/[assets]/[media]/whip_media_previews' 0 ''
      get 'https://github.com/WHIPFX/whip_media_map/releases/download/v1.0.0/whip_media_map-1.zip' 'resources/[assets]/[media]/whip_media_map' 0 ''
      get 'https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.1/whip_homes_mirrorpark-1.zip' 'resources/[assets]/whip_homes_mirrorpark' 0 ''
      get 'https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.1/whip_homes_mirrorpark-2.zip' 'resources/[assets]/whip_homes_mirrorpark' 0 ''
      get 'https://github.com/WHIPFX/whip_homes_mirrorpark/releases/download/v1.0.1/whip_homes_mirrorpark-3.zip' 'resources/[assets]/whip_homes_mirrorpark' 0 ''
      rm -rf "$tmp"
      echo "Done. Start the server: the ensure [assets] line in server.cfg starts the new packs."

  # ---- The database: empty. WHIP makes every table itself on its first start; there is no SQL file. ------------------
  - action: connect_database

  # ---- server.cfg: txAdmin fills in the {{...}} values when the deploy finishes --------------------------------------
  - action: write_file
    file: ./server.cfg
    data: |
      # Your WHIP server. Its name, description and tags are set on https://portal.cfx.re/servers
      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      {{serverEndpoints}}

      set mysql_connection_string "{{dbConnectionString}}"

      # The game build WHIP is made for (or newer)
      sv_enforceGameBuild 3889
      sv_scriptHookAllowed 0
      # Players need a Steam account linked to their Cfx.re account
      set sv_enforceSteamAuth true
      # Disable the Mumble voice server in favor of whip_voice
      set mumble_disableServer true

      ensure oxmysql
      ensure whip_core
      ensure whip_autos
      ensure whip_autos_shop
      ensure whip_chat
      ensure whip_dealership
      ensure whip_fuel
      ensure whip_gunny
      ensure whip_loadingscreen
      ensure whip_phone
      ensure whip_rope
      # whip_voice runs its own voice server on this machine, and FXServer lets a resource start a program only
      # with this line. Players send their voices to UDP 7882-7893 and TCP 7881: open those inbound, as 30120.
      add_unsafe_child_process_permission whip_voice
      ensure whip_voice
      ensure [assets]    # the media packs, the map packs and bob74_ipl

      # Your own resources go below, each after WHIP: ensure mycafe

      ## Admins: you (txAdmin's master account) are in group.admin, which gets WHIP's tools (/w and /whip)
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      add_ace group.admin whip.devtools allow
      {{addPrincipalsMaster}}
