# Publishes the recipes, and every file they download, to WHIP's CDN: a Cloudflare R2 bucket behind a custom domain.
# docs/cdn.md has the setup and how to run it. Each job only runs if the one before passed:
#
#   plan      what this run does (publish, stage or rollback), and whether the CDN is set up at all
#   check     the unit tests, and the recipes match recipe/manifest.toml
#   build     zip every resource at its tag and upload what is new to releases/<name>/<tag>/ (never replacing
#             anything). The heavy job: it runs on vars.WHIP_HEAVY_RUNNER (e.g. "boat"), or ubuntu-latest.
#   verify    download every zip back through the public CDN URL and check it, as txAdmin will get it
#   promote   publish the CDN recipes under recipes/<release>/, check them, then point recipes/*.yaml at them.
#             Runs in the "cdn" environment, so it can wait for a maintainer's approval.
#   rollback  (Run workflow > rollback) point recipes/*.yaml back at an earlier release, and check them
#
# A push to main that changes the manifest publishes a release, and so does each Recipe update run (when a resource
# publishes a release, tools/recipe_update.py moves its tag in the manifest). A resource repo can also call this
# workflow when it publishes a release ("stage": build, upload and verify that one resource, without changing any
# recipe), so the zips are already on the CDN when the manifest moves to the new tag: see templates/release-zips.yml.
name: CDN

on:
  push:
    branches: [main]
    paths:
      - recipe/**
      - tools/cdn.py
      - tools/recipes.py
      - tools/release_zips.py
      - .github/workflows/cdn.yml
  # The Recipe update (recipe-update.yml) pushes its moves with the workflow's own token, and GitHub starts no push
  # workflows for those: this picks them up when it finishes. A run that moved nothing publishes nothing (promote sees
  # the CDN already serves the same recipes).
  workflow_run:
    workflows: [Recipe update]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: publish the manifest as a new release, or roll the stable recipes back to an earlier one
        type: choice
        options: [publish, rollback]
        default: publish
      release_id:
        description: "rollback: the release to go back to (listed in recipes/releases.json and each run's summary)"
        type: string
        required: false
  workflow_call:
    inputs:
      resource:
        description: The resource to stage, e.g. whip_media_props
        type: string
        required: true
      tag:
        description: Its release's tag
        type: string
        required: true
      cdn_base:
        description: The CDN's public URL, e.g. https://cdn.example.com
        type: string
        required: true
      runner:
        description: The runner for the heavy jobs, e.g. boat
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      CF_API_TOKEN:  # staging never purges, but the promote job names them
        required: false
      CF_ZONE_ID:
        required: false

permissions:
  contents: read

env:
  WHIP_CDN_BASE: ${{ inputs.cdn_base || vars.WHIP_CDN_BASE }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      ready: ${{ steps.plan.outputs.ready }}
      release_id: ${{ steps.plan.outputs.release_id }}
    steps:
      - id: plan
        env:
          RESOURCE: ${{ inputs.resource }}
          ACTION: ${{ inputs.action }}
          HAS_KEYS: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          set -euo pipefail
          if [ -n "$RESOURCE" ]; then mode=stage; elif [ "$ACTION" = rollback ]; then mode=rollback; else mode=publish; fi
          ready=true
          if [ "$HAS_KEYS" != true ] || [ -z "$WHIP_CDN_BASE" ]; then
            ready=false
            echo "::notice::The CDN isn't set up here (the R2_* secrets and the WHIP_CDN_BASE variable): nothing to publish. See docs/cdn.md."
          fi
          {
            echo "mode=$mode"
            echo "ready=$ready"
            echo "release_id=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $mode, ready: $ready"

  check:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.mode != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.mode == 'stage' && 'WHIPFX/txAdmin-recipe' || github.repository }}
          ref: ${{ needs.plan.outputs.mode == 'stage' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -I -m unittest discover -s tools/tests -b
      - name: The recipes match recipe/manifest.toml
        run: python -I tools/recipes.py --check

  build:
    needs: [plan, check]
    runs-on: ${{ inputs.runner || vars.WHIP_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.mode == 'stage' && 'WHIPFX/txAdmin-recipe' || github.repository }}
          ref: ${{ needs.plan.outputs.mode == 'stage' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: The aws CLI (R2's S3 API)
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/bin"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/bin/aws" --version
          else
            aws --version
          fi
      - name: Build the zips (a resource already in the bucket at its tag is not built again)
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          RESOURCE: ${{ inputs.resource }}
          TAG: ${{ inputs.tag }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          only=()
          if [ "$MODE" = stage ]; then only=(--only "$RESOURCE" --tag "$TAG"); fi
          python -I tools/cdn.py build --store "s3:$R2_BUCKET" --dist dist "${only[@]}"
      - name: Upload the new zips (never replacing an object)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -I tools/cdn.py upload --store "s3:$R2_BUCKET" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cdn-index
          path: dist/index/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [plan, build]
    runs-on: ${{ inputs.runner || vars.WHIP_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.mode == 'stage' && 'WHIPFX/txAdmin-recipe' || github.repository }}
          ref: ${{ needs.plan.outputs.mode == 'stage' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cdn-index
          path: dist/index
      - name: Download every zip through the CDN and check it
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          RESOURCE: ${{ inputs.resource }}
        run: |
          set -euo pipefail
          only=()
          if [ "$MODE" = stage ]; then only=(--only "$RESOURCE"); fi
          python -I tools/cdn.py verify --dist dist "${only[@]}" | tee verify.log
          { echo "### Verify through $WHIP_CDN_BASE"; echo; echo '```'; cat verify.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cdn-verified
          path: |
            dist/index/
            dist/verified.json
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [plan, verify]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cdn
    concurrency:
      group: whip-cdn-recipes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # to tell whether the release the CDN serves comes from a newer commit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cdn-verified
          path: dist
      - name: txAdmin's recipe parser accepts the CDN recipes
        env:
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
        run: |
          set -euo pipefail
          python -I tools/cdn.py render --dist dist --release-id "$RELEASE_ID"
          npm install --silent --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/js" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/js/node_modules" node tools/validate_recipes.cjs dist/recipes/*.yaml
      - name: Publish the recipes, check them, then make them the stable ones
        env:
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          aws --version
          python -I tools/cdn.py promote --store "s3:$R2_BUCKET" --dist dist --release-id "$RELEASE_ID" --commit "$GITHUB_SHA"
          {
            echo "### Release $RELEASE_ID"
            echo
            for f in whip-legacy whip-enhanced whip-legacy-lite whip-enhanced-lite; do echo "- $WHIP_CDN_BASE/recipes/$f.yaml"; done
            echo
            echo '```'
            python -I tools/cdn.py releases --store "s3:$R2_BUCKET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.mode == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cdn
    concurrency:
      group: whip-cdn-recipes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Point the stable recipes at the release, and check them
        env:
          TO: ${{ inputs.release_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TO" ]; then echo "::error::Set release_id to the release to go back to"; exit 1; fi
          aws --version
          python -I tools/cdn.py rollback --store "s3:$R2_BUCKET" --to "$TO"
          { echo "### Rolled back to $TO"; echo; echo '```'; python -I tools/cdn.py releases --store "s3:$R2_BUCKET"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
