# Checks every change to the recipes: the unit tests pass, each recipe is what recipe/manifest.toml makes, and
# txAdmin's own parser rules accept them all.
name: Recipes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -I -m unittest discover -s tools/tests -b
      - name: The recipes match recipe/manifest.toml
        run: python -I tools/recipes.py --check
      - name: txAdmin's recipe parser accepts every recipe
        run: |
          set -euo pipefail
          # js-yaml 4, as txAdmin reads recipes with
          npm install --silent --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/js" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/js/node_modules" node tools/validate_recipes.cjs whip-*.yaml
