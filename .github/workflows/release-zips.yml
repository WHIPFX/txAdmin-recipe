# Makes a release's zips for the recipes (see tools/release_zips.py) and attaches them to the release. The resource
# repos call this when they publish a release; templates/release-zips.yml is what each of them has.
name: Release zips

on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag
        required: true
        type: string
      dest:
        description: The resource's folder in the recipes, e.g. ./resources/[assets]/[media]/whip_media_props
        required: true
        type: string

jobs:
  zips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # to attach the zips to the calling repo's release
    steps:
      - name: Get the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: WHIPFX/txAdmin-recipe
          ref: main
          path: recipe
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Make and attach the zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DEST: ${{ inputs.dest }}
        run: |
          set -euo pipefail
          python -I recipe/tools/release_zips.py "${GITHUB_REPOSITORY#*/}" "$TAG" --dest "$DEST" > tasks.yaml
          parts=$(sed -n 's/^# parts = //p' tasks.yaml)
          {
            echo "### For the recipes"
            echo
            echo "The Recipe update in WHIPFX/txAdmin-recipe moves this resource to these in recipe/manifest.toml and"
            echo "regenerates the recipes from it:"
            echo
            echo '```toml'
            echo "tag = \"$TAG\""
            echo "parts = $parts"
            echo '```'
            echo
            echo "<details><summary>The tasks this makes in the GitHub recipes</summary>"
            echo
            echo '```yaml'
            cat tasks.yaml
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
