# Moves both recipes to each WHIPFX resource's latest release and pushes that to main (tools/recipe_update.py). A
# resource repo starts it when it publishes a release (templates/recipes.yml, through tell-recipes.yml); Actions >
# Recipe update > Run workflow starts it by hand. It pushes as the WHIP Recipes GitHub App (org secret
# WHIP_RECIPE_APP_KEY), the one actor this repo's main ruleset lets push without a pull request.
name: Recipe update
run-name: "Recipe update: ${{ inputs.from || 'by hand' }}"

on:
  workflow_dispatch:
    inputs:
      from:
        description: What started it, e.g. "whip_core v1.2.0" (every resource is checked either way)
        required: false
        default: ""

# One at a time. GitHub keeps only the newest run waiting behind the one running, which is enough: each checks them all.
concurrency:
  group: recipe-update
  cancel-in-progress: false

permissions:
  contents: read  # the push to main goes as the app, with its own token

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The app's token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23litWjw8TT96BndEg  # WHIP Recipes, github.com/apps/whip-recipes
          private-key: ${{ secrets.WHIP_RECIPE_APP_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Move the recipes
        env:
          GH_TOKEN: ${{ github.token }}  # reads the resources' releases; the push uses the app's token from checkout
        run: |
          git config user.name "whip-recipes[bot]"
          git config user.email "358076870+whip-recipes[bot]@users.noreply.github.com"
          python -I tools/recipe_update.py
