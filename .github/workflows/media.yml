# Publishes WHIP's picture packs to WHIP's CDN (media.whipfx.net) with tools/media.py: each new or changed picture
# once, and media/index.json, which whip_core reads to know which pictures there are. A picture pack's release moves
# its tag in recipe/manifest.toml (the Recipe update, which pushes as the WHIP Recipes app: its pushes start
# workflows), and that push runs this. Actions > Media > Run workflow runs it by hand.
#
# The R2 key is a secret of the "cdn" environment, which only main can use.
name: Media

on:
  push:
    branches: [main]
    paths:
      - recipe/manifest.toml
      - tools/media.py
      - .github/workflows/media.yml
  workflow_dispatch:
    inputs:
      force:
        description: Go through every picture pack, even one the CDN already has at its tag
        type: boolean
        default: false

# One at a time, in the order they started.
concurrency:
  group: whip-media
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cdn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: boto3 (R2's S3 API)
        run: python -m pip install --quiet --disable-pip-version-check "boto3==1.44.0"

      - name: Publish the picture packs
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
          WHIP_CDN_BASE: ${{ vars.WHIP_CDN_BASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$WHIP_CDN_BASE" ]; then
            echo "::notice::No WHIP_CDN_BASE variable: the CDN isn't set up, nothing to publish."
            exit 0
          fi
          python -I tools/media.py publish $FORCE | tee publish.log
          { echo '### Picture packs'; echo; echo '```'; cat publish.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
